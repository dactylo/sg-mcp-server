# ==========================================================
# Build System
# ==========================================================
[build-system]
build-backend = "hatchling.build"
requires = [ "editables~=0.3", "hatch-fancy-pypi-readme>=25.1", "hatchling>=1.27" ]

# ==========================================================
# Project Metadata
# ==========================================================
[project]
name = "sg-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for Autodesk Flow Production Tracking"
keywords = [ "flow-production-tracking", "mcp", "server", "shotgrid", "shotgun" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = [ "readme" ]
dependencies = [
  "anyio>=4.9",
  "jsonschema>=4.20",
  "mcp>=2,<3",
  "tzdata",
]
optional-dependencies.official = [
  "shotgun-api3>=3.10.2",
]
urls.Documentation = "https://github.com/dactylo/sg-mcp-server/tree/main/docs"
urls.Homepage = "https://github.com/dactylo/sg-mcp-server"
urls.Issues = "https://github.com/dactylo/sg-mcp-server/issues"
urls.Repository = "https://github.com/dactylo/sg-mcp-server"
scripts.sg-mcp-server = "sg_mcp_server:main"

[dependency-groups]
dev = [
  "mdformat",
  "mdformat-config",
  "mdformat-frontmatter",
  "mdformat-gfm",
  "mdformat-pyproject",
  "mdformat-ruff",
  "mdformat-shfmt",
  "pyproject-fmt",
  "pyright",
  "ruff",
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-xdist>=3.2",
]
ci-build = [
  "maturin>=1.10,<2",
]

[tool.hatch]
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.targets.wheel.packages = [ "src/sg_mcp_server" ]
build.targets.sdist.include = [ "/README.md", "/src" ]

# Keep checkout links relative; package links target this release.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]\n]*\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://raw.githubusercontent.com/dactylo/sg-mcp-server/v$HFPR_VERSION/\2\3'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)(\[[^\]\n]+\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://github.com/dactylo/sg-mcp-server/blob/v$HFPR_VERSION/\2\3'

[tool.uv]
# CI supplies the native Taplo CLI; its Python package lacks Linux/Windows ARM wheels.
exclude-dependencies = [
  { package = { name = "mdformat-config", version = "0.2.1" }, dependencies = [ "taplo" ] },
]

# ==========================================================
# Ruff Configuration
# ==========================================================
[tool.ruff]
target-version = "py311"
line-length = 99
format.quote-style = "single"
format.exclude = [ "*.md" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Conflicts with the Ruff formatter
  "CPY001", # Copyright notices are not required
  "EM101",  # Exception must not use string literal
  "EM102",  # Exception must not use f-string literal
  "FBT001", # Boolean positional arg in function definition
  "FBT002", # Boolean default value in function definition
  "Q000",   # Conflicts with the Ruff formatter
  "Q003",   # Conflicts with the Ruff formatter
  "T201",   # print() found
  "TRY003", # Avoid specifying long messages outside exception class
]
# Exact-file exceptions for same-file private collaboration, intentional output, and tests.
lint.per-file-ignores."experiments/arms/_arm_b.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/arms/_arm_d.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/arms/_arm_e.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/bakeoff/dataset/seed.py" = [ "T201" ]
lint.per-file-ignores."experiments/bakeoff/driver.py" = [ "T201" ]
lint.per-file-ignores."experiments/bakeoff/fixtures/augment_schema.py" = [ "T201" ]
lint.per-file-ignores."experiments/bakeoff/harness/_questions.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/bakeoff/harness/_schema_tools.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/bakeoff/harness/runner.py" = [ "SLF001", "T201" ]
lint.per-file-ignores."experiments/model_benchmark/_artifacts.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_budget.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_claude.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_cli.py" = [ "T201" ]
lint.per-file-ignores."experiments/model_benchmark/_codex.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_interface_aggregation.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_interface_gate.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_interface_replay.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_live.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_realism.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_report.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_runner.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/model_benchmark/_subprocess.py" = [ "SLF001" ]
lint.per-file-ignores."experiments/tests/**/*.py" = [
  "D",       # No docstrings required in tests
  "PLR2004", # Allow magic values in tests
  "S101",    # Allow asserts in tests
  "S603",    # Allow subprocess calls in tests
  "SLF001",  # Tests intentionally inspect and patch private state
]
# Fake-host CLI responses intentionally use stdout.
lint.per-file-ignores."experiments/tests/model_benchmark/fake_claude.py" = [ "T201" ]
lint.per-file-ignores."experiments/tests/model_benchmark/fake_codex.py" = [ "T201" ]
lint.per-file-ignores."scripts/diagnose_live_latency.py" = [ "T201" ]
lint.per-file-ignores."scripts/smoke_test_live.py" = [ "SLF001", "T201" ]
lint.per-file-ignores."src/sg_mcp_server/_audit.py" = [ "T201" ]
lint.per-file-ignores."src/sg_mcp_server/_diagnostics.py" = [ "T201" ]
lint.per-file-ignores."src/sg_mcp_server/_engine/_validation.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_mcp_server/_rendering.py" = [ "SLF001" ]
lint.per-file-ignores."tests/**/*.py" = [
  "D",       # No docstrings required in tests
  "PLR2004", # Allow magic values in tests
  "S101",    # Allow asserts in tests
  "S603",    # Allow subprocess calls in tests
  "S607",    # Allow partial executable paths in tests
  "SLF001",  # Tests intentionally inspect and patch private state
]
lint.pydocstyle.convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.15"

# ==========================================================
# Pyright Configuration
# ==========================================================
[tool.pyright]
pythonVersion = "3.11"  # Keep in sync with tool.ruff.target-version
typeCheckingMode = "strict"
extraPaths = [ ".", "src" ]
executionEnvironments = [
  { root = "tests/scripts", reportPrivateUsage = "none" },
  { root = "tests", reportPrivateUsage = "none" },
  { root = "experiments/tests", reportPrivateUsage = "none" },
  { root = "." },
]

# ==========================================================
# Pytest Configuration
# ==========================================================
[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src", "tests" ]
ini_options.addopts = [ "-q", "--strict-markers", "--tb=short" ]
ini_options.markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')" ]
ini_options.faulthandler_timeout = 300

# ==========================================================
# Mdformat Configuration (Requires mdformat-pyproject)
# ==========================================================
[tool.mdformat]
wrap = 99  # Keep in sync with tool.ruff.line-length
number = true
